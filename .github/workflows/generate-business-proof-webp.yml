name: Generate business proof WebP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-business-proof-webp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sharp converter
        run: npm install --no-save sharp

      - name: Convert AVIF proof images to WebP and update references
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          const base = 'public/images/business-proof';
          const names = ['premises-signage', 'signage-detail', 'work-vehicle'];

          async function main() {
            for (const name of names) {
              await sharp(`${base}/${name}.avif`)
                .webp({ quality: 84, effort: 6 })
                .toFile(`${base}/${name}.webp`);
            }

            const dataPath = 'data/businessProof.ts';
            const source = fs.readFileSync(dataPath, 'utf8');
            fs.writeFileSync(dataPath, source.replaceAll('.avif', '.webp'));
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit converted images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/business-proof/premises-signage.webp \
                  public/images/business-proof/signage-detail.webp \
                  public/images/business-proof/work-vehicle.webp \
                  data/businessProof.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: serve business proof images as WebP"
          git push origin HEAD:main
