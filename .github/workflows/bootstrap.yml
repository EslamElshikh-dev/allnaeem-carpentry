name: Bootstrap complete project

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: bootstrap-allnaeem-project
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.ref == 'bootstrap-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify project archive
        shell: bash
        run: |
          set -euo pipefail

          test -f .bootstrap/part-00
          test -f .bootstrap/part-01
          test -f .bootstrap/part-02
          test -f .bootstrap/part-03a
          test -f .bootstrap/part-03b
          test -f .bootstrap/part-04
          test -f .bootstrap/part-05
          test -f .bootstrap/part-06
          test -f .bootstrap/part-07
          test -f .bootstrap/part-08

          cat .bootstrap/part-* | tr -d '\r\n' | base64 --decode > /tmp/allnaeem-project.tar.gz
          echo "9f5a7d558dd5a280bb30f5cef8f022452f3e0474efdcfe55c8d88e2638a39ea4  /tmp/allnaeem-project.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/allnaeem-project.tar.gz > /dev/null

      - name: Extract complete project
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/allnaeem-project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit generated project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi

          git commit -m "feat: build complete allnaeem carpentry website"
          git push origin HEAD:main
